[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redact-secret-vault"
version = "0.1.0b3"
description = "Native Python server authority for redact-secret-vault, implementing the same server-authority contract as the JavaScript @redact-secret/vault-server: principal/tenant resolution, fail-closed decision tuple evaluation, denial vocabulary, and audit events over an in-memory store."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "redact-secret" }]
keywords = ["redaction", "secrets", "llm", "vault", "server-authority"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/redact-secret/redact-secret-vault/tree/main/packages/vault-py"
Issues = "https://github.com/redact-secret/redact-secret-vault/issues"

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]
lint = ["ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/redact_secret_vault"]
artifacts = ["src/redact_secret_vault/boundary/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
