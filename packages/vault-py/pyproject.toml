[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redact-secret-vault"
version = "0.1.0b5"
description = "Native Python server authority for redact-secret-vault, implementing the same server-authority contract as the JavaScript @redact-secret/vault-server: principal/tenant resolution, fail-closed decision tuple evaluation, denial vocabulary, and audit events over an in-memory store."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "redact-secret" }]
keywords = ["redaction", "secrets", "llm", "vault", "server-authority"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/redact-secret/redact-secret-vault/tree/main/packages/vault-py"
Issues = "https://github.com/redact-secret/redact-secret-vault/issues"

[project.optional-dependencies]
# Optional building blocks of the persistent vault groundwork (not supported; see
# docs/plans/python-persistence-parity.md and docs/decisions/python-persistence-api-and-packaging.md).
# The base install has no runtime dependency; each extra brings one dependency family.
crypto = ["cryptography>=47"]
postgres = ["psycopg>=3.2,<4"]
aws-kms = ["boto3>=1.43"]
test = ["pytest>=8.0,<9"]
lint = ["ruff>=0.6,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/redact_secret_vault"]
artifacts = ["src/redact_secret_vault/boundary/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# A qualification tool whose result lines are long sentences; not part of the wheel.
"tests/bridge_qualification.py" = ["E501"]
