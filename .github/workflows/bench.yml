name: bench

# Release-candidate performance comparison (#83, epic #74): the workspace
# build against the previous published version, interleaved in one job per
# PII mode, reported as candidate÷baseline ratios. See
# docs/research/perf/README.md and RELEASING.md.
#
# Not part of `ci` and not a required check. It runs on a `v<version>` tag
# push (next to release.yml, against the tagged commit) and by hand with
# workflow_dispatch (e.g. on the version-bump commit before tagging). A
# gating `fail` verdict or a failed metric fails the job; warnings do not.
# Results are uploaded as artifacts; nothing is committed or published.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      baseline:
        description: "Exact published @redact-secret/vault version to compare against (empty: bench/baseline.json)"
        required: false
        default: ""
        type: string
      pii:
        description: "PII mode(s) to measure"
        required: false
        default: both
        type: choice
        options: [both, "off", "on"]
      tier:
        description: "standard (fits a CI job) or extended (adds the ceiling and 100 000-entry shapes; much slower)"
        required: false
        default: standard
        type: choice
        options: [standard, extended]

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: compare pii ${{ matrix.pii }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.tier == 'extended' && 150 || 45 }}
    strategy:
      fail-fast: false
      matrix:
        pii: ${{ fromJSON(inputs.pii == 'off' && '["off"]' || inputs.pii == 'on' && '["on"]' || '["off","on"]') }}
    env:
      PII: ${{ matrix.pii }}
      BASELINE: ${{ inputs.baseline }}
      TIER: ${{ inputs.tier || 'standard' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # No dependency cache: this runs on release tags, and a cache
          # written by another ref must not feed a release measurement.
          package-manager-cache: false
      - run: npm ci
      # Chromium only (about a minute with its system dependencies), for
      # cold-init-browser and the Worker boundary script.
      - run: npx playwright install --with-deps chromium
      - name: Compare against the baseline
        run: |
          args=(--pii "$PII" --tier "$TIER" --out ".bench-results/compare-pii-$PII.json")
          if [ -n "$BASELINE" ]; then args+=(--baseline "$BASELINE"); fi
          npm run bench:compare -- "${args[@]}"
      - name: Worker boundary (candidate only)
        if: ${{ matrix.pii == 'off' && !cancelled() }}
        run: npm run bench:worker -- --out .bench-results/worker-boundary.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: bench-pii-${{ matrix.pii }}
          path: .bench-results/*.json
          if-no-files-found: error

  # Builds the per-release archive (docs/research/perf/<version>.json) from
  # the compare results, as an artifact for the maintainer to commit. It
  # refuses A/A runs (candidate version equal to the baseline), so a run on a
  # commit whose version was not bumped fails here and archives nothing.
  archive:
    name: archive
    needs: compare
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bench-pii-*
          path: ${{ runner.temp }}/bench
      - name: Build the archive
        env:
          RESULTS_DIR: ${{ runner.temp }}/bench
        run: |
          mapfile -d '' results < <(find "$RESULTS_DIR" -name 'compare-pii-*.json' -print0 | sort -z)
          node bench/archive.mjs --out-dir .bench-archive "${results[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-archive
          path: .bench-archive/*.json
          if-no-files-found: error
