name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:persistence-boundaries
      - run: npm run check:links
      - run: npm run test:scripts
      - name: Validate conformance corpus JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("conformance/v1/corpus.json","utf8"))'

  vault-server:
    name: vault-server node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:vault-server
      # The runnable examples (examples/README.md): each asserts its own output.
      - run: npm run examples

  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit tests: PII retention/activation contract against a fake core
      # (PII-capable and beta.9-shaped) and real-core PII-on tests against the
      # pinned beta.12; real-core beta.9-only checks skip with a stated reason.
      - run: npm run test:vault
      - run: npm run qualify:node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-node-${{ matrix.node }}-${{ matrix.os }}
          path: .qualification/reports/
          if-no-files-found: error

  # Persistence packages (#4): contracts, crypto and the local key provider,
  # the conformance harness, and the non-durable reference store. No database
  # and no key service: these are the parts every runtime in the matrix runs.
  persistence:
    name: persistence node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:persistence

  # @redact-secret/store-postgres against a real PostgreSQL server (#20): the
  # shared Store conformance suite, including the two-connection schedules.
  # The serving role is not a superuser and holds only the adapter's grants.
  # Synthetic, runner-local password; nothing here is a credential.
  postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSV_PG_ADMIN_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      RSV_PG_APP_URL: postgres://rsv_app:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the serving role
        run: node packages/store-postgres/scripts/create-app-role.mjs
      - run: npm run test:postgres
      # The persistent example (examples/persistent): setup twice to show it is
      # idempotent, then capture in one process and restore in another.
      - name: Persistent example
        run: |
          node examples/persistent/setup.mjs
          node examples/persistent/setup.mjs
          node examples/persistent/demo.mjs
      # Packed tarballs in clean projects outside the repository: the base
      # packages install no driver or SDK, and the persistent profile runs over
      # the reference store and this PostgreSQL.
      - run: npm run qualify:persistence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-persistence-postgres-${{ matrix.postgres }}
          path: .qualification/reports/
          if-no-files-found: error

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-browser
          path: .qualification/reports/
          if-no-files-found: error

  # Optional dedicated-Worker mode (#14): separately qualified evidence, kept
  # apart from the `browser` job above so a Worker-mode regression cannot be
  # mistaken for a main-thread regression, or vice versa (Gate V).
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-worker
          path: .qualification/reports/
          if-no-files-found: error

  python:
    name: python ${{ matrix.python }} (vault-py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # @redact-secret/core has no native Python distribution; the package's
      # capture path shells out to it over a Node.js subprocess boundary
      # (packages/vault-py/src/redact_secret_vault/boundary/core_bridge.mjs).
      # See docs/research/python-server-integration-2026-09-27.md.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/vault-py/pyproject.toml
      - run: pip install -e ".[test,lint]"
        working-directory: packages/vault-py
      - run: ruff check .
        working-directory: packages/vault-py
      - run: pytest -q
        working-directory: packages/vault-py
      - name: Python example
        run: python examples/05-python-server.py
