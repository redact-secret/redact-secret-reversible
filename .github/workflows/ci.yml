name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm run check:persistence-boundaries
      - run: npm run check:links
      - run: npm run test:scripts
      - name: Validate conformance corpus JSON
        run: node -e 'JSON.parse(require("fs").readFileSync("conformance/v1/corpus.json","utf8"))'

  vault-server:
    name: vault-server node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:vault-server
      # The runnable examples (examples/README.md): each asserts its own output.
      - run: npm run examples

  node:
    name: node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Unit tests: PII retention/activation contract against a fake core
      # (PII-capable and beta.9-shaped) and real-core PII-on tests against the
      # pinned beta.12; real-core beta.9-only checks skip with a stated reason.
      - run: npm run test:vault
      - run: npm run qualify:node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-node-${{ matrix.node }}-${{ matrix.os }}
          path: .qualification/reports/
          if-no-files-found: error

  # Persistence packages (#4): contracts, crypto and the local key provider,
  # the conformance harness, and the non-durable reference store. No database
  # and no key service: these are the parts every runtime in the matrix runs.
  persistence:
    name: persistence node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:persistence

  # @redact-secret/store-postgres against a real PostgreSQL server (#20): the
  # shared Store conformance suite, including the two-connection schedules.
  # The serving role is not a superuser and holds only the adapter's grants.
  # Synthetic, runner-local password; nothing here is a credential.
  postgres:
    name: postgres ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSV_PG_ADMIN_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      RSV_PG_APP_URL: postgres://rsv_app:synthetic-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the serving role
        run: node packages/store-postgres/scripts/create-app-role.mjs
      - run: npm run test:postgres
      # The persistent example (examples/persistent): setup twice to show it is
      # idempotent, then capture in one process and restore in another.
      - name: Persistent example
        run: |
          node examples/persistent/setup.mjs
          node examples/persistent/setup.mjs
          node examples/persistent/demo.mjs
      # Packed tarballs in clean projects outside the repository: the base
      # packages install no driver or SDK, and the persistent profile runs over
      # the reference store and this PostgreSQL.
      - run: npm run qualify:persistence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-persistence-postgres-${{ matrix.postgres }}
          path: .qualification/reports/
          if-no-files-found: error

  # @redact-secret/store-sqlite on real SQLite files (#130): the shared Store
  # conformance suite with its two-connection schedules, two server processes
  # on one file, process kills around commit, and backup and restore. No
  # service container: the database is a local file. Linux and macOS (the
  # macOS runner exercises fullfsync). This is application-crash evidence;
  # power loss is not simulated by any workflow.
  #
  # This is the only job that installs better-sqlite3 and runs its install
  # script, in its own step below, from qualification/sqlite-driver (exact
  # version and integrity in that directory's lockfile). Every other job's
  # `npm ci` installs no native addon. node:sqlite needs no install: it is
  # exercised where the runner's Node.js bundles SQLite 3.51.3 or later, which
  # the minor releases `setup-node` resolves for 22 and 24 do (RELEASING.md
  # and the qualification record give the measured minimums); Node.js 20 has
  # none, so it runs better-sqlite3 only.
  sqlite:
    name: sqlite node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      RSV_SQLITE_DRIVERS: ${{ matrix.node == 20 && 'better-sqlite3' || 'better-sqlite3,node:sqlite' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install better-sqlite3 (the only install script this repository runs)
        run: npm run install:sqlite-driver
      - run: npm run test:sqlite
      # The packed store in clean projects: over node:sqlite where it can run, and over
      # better-sqlite3 installed into the consumer project (the flag allows its install script there).
      - run: npm run qualify:persistence
        env:
          RSV_QUALIFY_BETTER_SQLITE3: "1"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-browser
          path: .qualification/reports/
          if-no-files-found: error

  # Optional dedicated-Worker mode (#14): separately qualified evidence, kept
  # apart from the `browser` job above so a Worker-mode regression cannot be
  # mistaken for a main-thread regression, or vice versa (Gate V).
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:worker
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports-worker
          path: .qualification/reports/
          if-no-files-found: error

  python:
    name: python ${{ matrix.python }} (vault-py)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # @redact-secret/core has no native Python distribution; the package's
      # capture path shells out to it over a Node.js subprocess boundary
      # (packages/vault-py/src/redact_secret_vault/boundary/core_bridge.mjs).
      # See docs/research/python-server-integration-2026-09-27.md.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/vault-py/pyproject.toml
      # The aws-kms extra (boto3) is installed so the key provider's tests run against
      # a fake client; no AWS call is made and no credential is present. The real-key
      # interoperation tests skip with their reason here.
      - run: pip install -e ".[test,lint,crypto,aws-kms]"
        working-directory: packages/vault-py
      - run: ruff check .
        working-directory: packages/vault-py
      - run: pytest -q
        working-directory: packages/vault-py
      - name: Python example
        run: python examples/05-python-server.py

  # The packed wheel, not an editable install: the base install has no runtime
  # dependency, the three extras exist, and importing one optional module never
  # loads another family's dependency (docs/plans/python-persistence-parity.md
  # section 4.2). The isolation script builds clean virtualenvs outside the
  # repository and installs from the package index.
  python-wheel:
    name: python wheel extras and import isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build==1.6.1
      - name: Build sdist and wheel
        working-directory: packages/vault-py
        run: python -m build
      - name: Verify metadata (no Requires-Dist outside the extras) and contents
        working-directory: packages/vault-py
        run: python ../../scripts/verify-python-dist.py
      - name: Import isolation in clean virtualenvs
        run: python scripts/check-python-isolation.py packages/vault-py/dist/*.whl

  # The Python PostgreSQL adapter (redact_secret_vault.stores.postgres, #126)
  # against a real PostgreSQL server, modeled on the `postgres 17` job above:
  # service container, a serving role that is not a superuser, the schema owned
  # by @redact-secret/store-postgres (the Python adapter creates no table), and
  # synthetic runner-local passwords. The schedule corpus runs through the
  # Python driver (control clock, database clock, with and without holds), then
  # the two-process cases with real processes, disconnects around COMMIT, the
  # malicious-row cases, the DEBUG-log leak test, and the mixed-language runs
  # against the JavaScript persistent server.
  #
  # This is the only job that installs psycopg (the `postgres` extra, with the
  # binary build and the pool used by one test); the `python` job installs
  # neither, so the tests of the adapter are skipped there with their reason.
  # RSV_REQUIRE_POSTGRES=1 turns a missing database into a failure here: a run
  # without a database proves nothing and must not look like a pass.
  python-postgres:
    name: python postgres ${{ matrix.postgres }} (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        postgres: ["17"]
        python: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RSV_PG_ADMIN_URL: postgres://postgres:synthetic-ci-only@127.0.0.1:5432/postgres
      RSV_PG_APP_URL: postgres://rsv_app:synthetic-ci-only@127.0.0.1:5432/postgres
      RSV_REQUIRE_POSTGRES: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The schema, the serving role, and the Node.js orchestrator of the schedule
      # corpus come from the JavaScript side.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The whole workspace: the cross-language tests drive the JavaScript persistent server
      # (vault-server, store-postgres) as a second process on the same database.
      - run: npm run build
      - name: Create the serving role and apply the schema
        run: |
          node packages/store-postgres/scripts/create-app-role.mjs
          node packages/vault-py/tests/pg_prepare.mjs
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: packages/vault-py/pyproject.toml
      - name: Install the package with the postgres extra
        run: pip install -e ".[test,lint,crypto,postgres]" "psycopg[binary]" psycopg-pool
        working-directory: packages/vault-py
      - name: Record the tested versions
        run: python -c "import psycopg, psycopg_pool, cryptography; print('psycopg', psycopg.__version__, 'libpq', psycopg.pq.version(), 'impl', psycopg.pq.__impl__, 'pool', psycopg_pool.__version__, 'cryptography', cryptography.__version__)"
      - run: ruff check .
        working-directory: packages/vault-py
      - name: PostgreSQL adapter, two-process, and diagnostics tests
        run: pytest -q -s tests/test_stores_postgres.py tests/test_stores_postgres_processes.py
        working-directory: packages/vault-py
      # One JavaScript and one Python persistent server process over this database
      # (mixed-language interoperation, #128), and capture parity with the
      # JavaScript persistent server on the shared corpus.
      - name: Cross-language interoperation and capture parity
        run: pytest -q -s tests/test_interop_postgres.py tests/test_capture_parity_javascript.py
        working-directory: packages/vault-py
      # The server over this database with the real core bridge and DEBUG logging for
      # psycopg and asyncio (G6, #128): no secret, token, data key, or driver text in a log,
      # an error, a repr, an audit event, or a row. The local key provider; not the KMS one.
      - name: Server-level leak test over PostgreSQL
        run: pytest -q -s tests/test_persistent_server_postgres_leaks.py
        working-directory: packages/vault-py
