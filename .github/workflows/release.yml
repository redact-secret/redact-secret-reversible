name: release

# Publishes the npm packages (@redact-secret/vault, then
# @redact-secret/vault-server) and the Python distribution (redact-secret-vault,
# to PyPI), all through trusted publishing. The npm and Python job chains are
# independent of each other.
# Triggered by pushing a `v<version>` tag (RELEASING.md step 3) or manually via
# workflow_dispatch (e.g. to retry after a transient failure — each publish job
# is idempotent per package, see below).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          # This workflow only ever runs to publish; never restore npm's
          # cache here, so a poisoned Actions cache can't reach an artifact
          # that gets published.
          package-manager-cache: false
      - run: npm ci
      - run: npm run check:boundaries

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run qualify:node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-reports-node
          path: .qualification/reports/
          if-no-files-found: error

  vault-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run test:vault-server

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run qualify:browser
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: release-reports-browser
          path: .qualification/reports/
          if-no-files-found: error

  # Publishes with npm trusted publishing (OIDC): no long-lived npm token, an
  # `id-token: write` grant scoped to this job only, and `--provenance` for a
  # signed build provenance attestation. Requires a trusted publisher
  # configured on npmjs.com pointing at this workflow for EACH package
  # (@redact-secret/vault and @redact-secret/vault-server; manual npmjs.com
  # steps — see RELEASING.md, issues #24 and #55). Until that is configured,
  # the affected package's publish step fails with an auth error; it does not
  # fall back to a token. The vault is published before the vault-server,
  # which depends on it at an exact version.
  publish:
    needs: [boundaries, vault-server, node, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Trusted publishing (OIDC) requires npm CLI >= 11.5.1; the runners'
      # bundled npm may be older. Pinned (not @latest) so this step installs
      # a known version rather than whatever the registry resolves at
      # run time; bump deliberately.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@12.1.0
      - run: npm run build -w @redact-secret/vault
      - run: npm run build -w @redact-secret/vault-server

      - name: Resolve version and dist-tag
        id: pkg
        run: |
          set -eu
          VERSION=$(node -p "require('./packages/vault/package.json').version")
          DIST_TAG=$(node -p "require('./packages/vault/package.json').publishConfig.tag")
          if [ "$DIST_TAG" = "latest" ]; then
            echo "::error::publishConfig.tag is 'latest' — this workflow only publishes explicit, non-latest dist-tags. See RELEASING.md's note on the latest dist-tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      # Guards against double-publishing a version that already exists on the
      # registry (npm itself also refuses this, but failing early here keeps
      # the run's intent — "nothing to publish" — legible in the logs, and
      # makes workflow_dispatch reruns on an already-published tag a no-op
      # instead of an error). The version/tag values from the previous step
      # are passed through `env:` rather than interpolated directly into the
      # script, so they're never substituted into shell syntax.
      - name: Check whether this version is already published
        id: guard
        env:
          PKG_VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          set -eu
          SPEC="@redact-secret/vault@${PKG_VERSION}"
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "$SPEC is already on the registry; skipping publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: npm publish --provenance
        if: steps.guard.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.pkg.outputs.dist_tag }}
        run: npm publish -w @redact-secret/vault --provenance --tag "$DIST_TAG"

      # @redact-secret/vault-server: the same non-latest dist-tag guard and
      # already-published guard as the vault above. Runs after the vault
      # publish so the exact @redact-secret/vault version it depends on is on
      # the registry first; the guard refuses to publish otherwise.
      - name: Resolve vault-server version and dist-tag
        id: server_pkg
        run: |
          set -eu
          VERSION=$(node -p "require('./packages/vault-server/package.json').version")
          DIST_TAG=$(node -p "require('./packages/vault-server/package.json').publishConfig.tag")
          VAULT_DEP=$(node -p "require('./packages/vault-server/package.json').dependencies['@redact-secret/vault']")
          if [ "$DIST_TAG" = "latest" ]; then
            echo "::error::vault-server publishConfig.tag is 'latest' — this workflow only publishes explicit, non-latest dist-tags. See RELEASING.md's note on the latest dist-tag." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
          echo "vault_dep=$VAULT_DEP" >> "$GITHUB_OUTPUT"

      - name: Check whether this vault-server version is already published
        id: server_guard
        env:
          PKG_VERSION: ${{ steps.server_pkg.outputs.version }}
          VAULT_DEP: ${{ steps.server_pkg.outputs.vault_dep }}
        run: |
          set -eu
          SPEC="@redact-secret/vault-server@${PKG_VERSION}"
          if npm view "$SPEC" version >/dev/null 2>&1; then
            echo "$SPEC is already on the registry; skipping publish." >&2
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A version published seconds ago (the vault step above) can 404 on
          # the registry for a minute or two while npm processes it, so this
          # dependency check retries (20 attempts, 15s apart, ~5 minutes)
          # before failing. The already-published check above stays a single
          # check.
          ATTEMPT=1
          until npm view "@redact-secret/vault@${VAULT_DEP}" version --prefer-online >/dev/null 2>&1; do
            if [ "$ATTEMPT" -ge 20 ]; then
              echo "::error::$SPEC depends on @redact-secret/vault@${VAULT_DEP}, which is not on the registry after $ATTEMPT attempts." >&2
              exit 1
            fi
            echo "@redact-secret/vault@${VAULT_DEP} not visible on the registry yet (attempt $ATTEMPT/20); retrying in 15s." >&2
            ATTEMPT=$((ATTEMPT + 1))
            sleep 15
          done
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: npm publish --provenance (vault-server)
        if: steps.server_guard.outputs.publish == 'true'
        env:
          DIST_TAG: ${{ steps.server_pkg.outputs.dist_tag }}
        run: npm publish -w @redact-secret/vault-server --provenance --tag "$DIST_TAG"

  # --- Python: redact-secret-vault -------------------------------------------
  # Independent of the npm jobs above: a failure in either chain does not block
  # the other's publish. CI already runs the full Python matrix; this re-runs
  # lint and tests once, on Python 3.12, against the released commit.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The capture path shells out to @redact-secret/core over a Node.js
      # subprocess boundary, so the tests need the npm workspace installed.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      # No pip cache, for the same reason as package-manager-cache above.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[test,lint]"
        working-directory: packages/vault-py
      - run: ruff check .
        working-directory: packages/vault-py
      - run: pytest -q
        working-directory: packages/vault-py

  # Builds the sdist and wheel once, checks them, and hands them to the publish
  # job as an artifact, so the job holding `id-token: write` never builds.
  python-dist:
    needs: [python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned so the build frontend and checker are known versions; bump
      # deliberately. (The build backend, hatchling, is resolved by `build`'s
      # isolated environment from pyproject.toml's [build-system].)
      - name: Install build tooling
        run: python -m pip install build==1.6.1 twine==7.0.0
      - name: Build sdist and wheel
        working-directory: packages/vault-py
        run: python -m build
      - name: Verify distribution contents and versions
        working-directory: packages/vault-py
        # Exactly one wheel and one sdist, the wheel carries
        # boundary/core_bridge.mjs, and both carry pyproject.toml's version.
        run: python ../../scripts/verify-python-dist.py
      - name: twine check
        working-directory: packages/vault-py
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: packages/vault-py/dist/
          if-no-files-found: error

  # Publishes with PyPI trusted publishing (OIDC): no PyPI API token, an
  # `id-token: write` grant scoped to this job only, and PEP 740 attestations
  # (gh-action-pypi-publish's default). PyPI has a pending publisher for
  # project `redact-secret-vault`, repository redact-secret/redact-secret-vault,
  # workflow `release.yml`, environment (Any); PyPI turns it into a normal
  # trusted publisher on the first upload. This job deliberately sets no
  # `environment:`. Adding one later requires updating the PyPI publisher to
  # name that environment as well (see RELEASING.md).
  pypi-publish:
    needs: [python-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read # checkout, to read pyproject.toml's version
      id-token: write # OIDC token for PyPI trusted publishing and attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Python package version
        id: pypkg
        run: |
          set -eu
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/vault-py/pyproject.toml", "rb"))["project"]["version"])')
          if [ -z "$VERSION" ]; then
            echo "::error::packages/vault-py/pyproject.toml has an empty project.version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # Same idea as the npm guards above: re-pushing a tag or re-running the
      # workflow when this version is already on PyPI is a no-op, not an
      # error. HTTP 200 means published, 404 means not published; any other
      # answer fails the job rather than guessing. The version is passed
      # through `env:`, never interpolated into the script.
      - name: Check whether this version is already on PyPI
        id: pyguard
        env:
          PKG_VERSION: ${{ steps.pypkg.outputs.version }}
        run: |
          set -eu
          if [ -z "$PKG_VERSION" ]; then
            echo "::error::Resolved Python package version is empty." >&2
            exit 1
          fi
          URL="https://pypi.org/pypi/redact-secret-vault/${PKG_VERSION}/json"
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' "$URL")
          case "$STATUS" in
            200)
              echo "redact-secret-vault ${PKG_VERSION} is already on PyPI; skipping publish." >&2
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Unexpected HTTP $STATUS from $URL." >&2
              exit 1
              ;;
          esac

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.pyguard.outputs.publish == 'true'
        with:
          name: python-dist
          path: dist/

      - name: Confirm the artifact matches the resolved version
        if: steps.pyguard.outputs.publish == 'true'
        env:
          PKG_VERSION: ${{ steps.pypkg.outputs.version }}
        run: |
          set -eu
          ls -l dist/
          test -f "dist/redact_secret_vault-${PKG_VERSION}.tar.gz"
          test -f "dist/redact_secret_vault-${PKG_VERSION}-py3-none-any.whl"
          test "$(find dist -type f | wc -l)" -eq 2

      - name: Publish to PyPI
        if: steps.pyguard.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
