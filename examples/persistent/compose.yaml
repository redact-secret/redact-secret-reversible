# A disposable PostgreSQL for the persistent example. Development only:
# the password is synthetic and the port is bound to this machine.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: synthetic-local-only
      POSTGRES_DB: rsv
    # The settings of the single-primary profile, stated instead of assumed.
    command: ["postgres", "-c", "fsync=on", "-c", "synchronous_commit=on", "-c", "full_page_writes=on"]
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rsv"]
      interval: 2s
      timeout: 3s
      retries: 30
